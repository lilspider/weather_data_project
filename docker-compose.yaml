services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin_password}
      - POSTGRES_DB=${POSTGRES_DB:-airflow_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-airflow_db}"]
      interval: 10s
      retries: 10
      timeout: 5s
      start_period: 30s
    # Remove exposed port for security - use internal network only
    # ports:
    #   - "5432:5432"
    volumes:
      - ./Postgres/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - my_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  airflow-common: &airflow-common
    image: ${AIRFLOW_IMAGE:-apache/airflow:2.10.2}
    user: "50000:50000"
    env_file:
      - .env
    environment:
      # Fixed: Using the same variables as the Postgres service to ensure connection works
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin_password}@postgres/${POSTGRES_DB:-airflow_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - AIRFLOW_USER=${AIRFLOW_USER:-admin}
      - AIRFLOW_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      - AIRFLOW_FIRSTNAME=${AIRFLOW_FIRSTNAME:-Admin}
      - AIRFLOW_LASTNAME=${AIRFLOW_LASTNAME:-User}
      - AIRFLOW_EMAIL=${AIRFLOW_EMAIL:-admin@example.com}
      - DBT_PROJECT_PATH=${DBT_PROJECT_PATH:-/opt/airflow/dbt}
      - _PIP_ADDITIONAL_REQUIREMENTS=psycopg2-binary requests python-dotenv dbt-core==1.6.0 dbt-postgres==1.6.0
    volumes:
      - ./Airflow/dags:/opt/airflow/dags:rw
      - ./API_request:/opt/airflow/API_request:rw
      - ./dbt:/opt/airflow/dbt:rw
    networks:
      - my_network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      retries: 5
      timeout: 10s
      start_period: 60s
    command: >
      bash -c "
      airflow db upgrade &&
      airflow users create --username ${AIRFLOW_USER:-admin} --firstname ${AIRFLOW_FIRSTNAME:-Admin} --lastname ${AIRFLOW_LASTNAME:-User} --role Admin --email ${AIRFLOW_EMAIL:-admin@example.com} --password ${AIRFLOW_PASSWORD:-admin} || true &&
      airflow webserver"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type Scheduler || exit 1"]
      interval: 30s
      retries: 5
      timeout: 10s
      start_period: 60s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - my_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

networks:
  my_network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local