version: 2

models:
  - name: fct_athlete_safety_index
    description: "Athlete safety index with WBGT calculations joined with stadium metadata"
    columns:
      - name: stadium_id
        description: "Foreign key to dim_stadiums"
        tests:
          - not_null
          - relationships:
        to: ref('dim_stadiums')
          field: stadium_id
      - name: stadium_name
        description: "Stadium name from dim_stadiums"
      - name: city
        description: "City name"
        tests:
          - not_null
      - name: country
        description: "Country"
      - name: lat
        description: "Stadium latitude"
      - name: lon
        description: "Stadium longitude"
      - name: elevation_m
        description: "Stadium elevation in meters"
      - name: capacity
        description: "Stadium seating capacity"
      - name: grass_type
        description: "Type of grass surface"
      - name: has_roof
        description: "Whether stadium has retractable roof"
      - name: temperature
        description: "Temperature in Celsius"
        tests:
          - not_null
      - name: humidity
        description: "Humidity percentage"
      - name: wind_speed
        description: "Wind speed in km/h"
      - name: wind_dir
        description: "Wind direction in degrees"
      - name: precip_mm
        description: "Precipitation in millimeters"
      - name: cloud
        description: "Cloud coverage percentage"
      - name: uv
        description: "UV index"
      - name: feelslike_c
        description: "Feels like temperature in Celsius"
      - name: dewpoint_c
        description: "Dew point in Celsius"
      - name: pressure_mb
        description: "Pressure in millibars"
      - name: vis_km
        description: "Visibility in kilometers"
      - name: wbgt
        description: "Calculated Wet Bulb Globe Temperature"
        tests:
          - not_null
      - name: wbgt_flag
        description: "FIFA safety flag classification"
        tests:
          - not_null
          - accepted_values:
              values: ['Green', 'Yellow', 'Orange', 'Red', 'Black']
      - name: recorded_at
        description: "Timestamp of weather reading"

  - name: fct_weather_observations
    description: "Weather observations fact table with stadium context"
    columns:
      - name: weather_observation_id
        description: "Primary key for weather observations"
        tests:
          - not_null
          - unique
      - name: stadium_id
        description: "Foreign key to dim_stadiums"
        tests:
          - not_null
          - relationships:
        to: ref('dim_stadiums')
          field: stadium_id
      - name: stadium_name
        description: "Stadium name from dim_stadiums"
      - name: city
        description: "City name"
        tests:
          - not_null
      - name: country
        description: "Country"
      - name: lat
        description: "Stadium latitude"
      - name: lon
        description: "Stadium longitude"
      - name: elevation_m
        description: "Stadium elevation in meters"
      - name: capacity
        description: "Stadium seating capacity"
      - name: grass_type
        description: "Type of grass surface"
      - name: has_roof
        description: "Whether stadium has retractable roof"
      - name: temperature
        description: "Temperature in Celsius"
        tests:
          - not_null
      - name: humidity
        description: "Humidity percentage"
      - name: wind_speed
        description: "Wind speed in km/h"
      - name: wind_dir
        description: "Wind direction in degrees"
      - name: precip_mm
        description: "Precipitation in millimeters"
      - name: cloud
        description: "Cloud coverage percentage"
      - name: uv
        description: "UV index"
      - name: feelslike_c
        description: "Feels like temperature in Celsius"
      - name: dewpoint_c
        description: "Dew point in Celsius"
      - name: pressure_mb
        description: "Pressure in millibars"
      - name: vis_km
        description: "Visibility in kilometers"
      - name: wbgt
        description: "Calculated Wet Bulb Globe Temperature"
        tests:
          - not_null
      - name: wbgt_flag
        description: "FIFA safety flag classification"
        tests:
          - not_null
          - accepted_values:
              values: ['Green', 'Yellow', 'Orange', 'Red', 'Black']
      - name: recorded_at
        description: "Timestamp of weather reading"
        tests:
          - not_null

  - name: fct_match_day_forecast
    description: "Weather forecasts for match days (placeholder)"
    columns:
      - name: stadium_id
        description: "Foreign key to dim_stadiums"
      - name: match_id
        description: "Match identifier"
      - name: kickoff_utc
        description: "Match kickoff time in UTC"
      - name: forecast_hour
        description: "Hour of forecast (0-23)"
      - name: forecast_temp_c
        description: "Forecasted temperature in Celsius"
      - name: forecast_humidity
        description: "Forecasted humidity percentage"
      - name: forecast_wind_kph
        description: "Forecasted wind speed in km/h"
      - name: chance_of_rain
        description: "Probability of precipitation (0-100%)"
      - name: forecast_wbgt
        description: "Calculated WBGT for forecast conditions"
      - name: forecast_wbgt_flag
        description: "FIFA safety flag for forecast"
      - name: created_at
        description: "Timestamp when forecast was generated"
